<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>6D — Mural de Frases</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #f5f4f0; --surface: #ffffff; --border: rgba(0,0,0,0.1);
      --border-hover: rgba(0,0,0,0.25); --text: #111111; --text-muted: #777777;
      --radius: 12px; --radius-sm: 8px;
    }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #0d0d0d; --surface: #1a1a1a; --border: rgba(255,255,255,0.1); --border-hover: rgba(255,255,255,0.25); --text: #f0f0f0; --text-muted: #888888; }
    }
    body { background: var(--bg); color: var(--text); font-family: 'DM Sans', sans-serif; min-height: 100vh; padding: 2rem 1rem 4rem; }
    .container { max-width: 680px; margin: 0 auto; }
    .hero { background: #0d0d0d; border-radius: var(--radius); padding: 2rem 1.5rem 1.5rem; margin-bottom: 1.5rem; position: relative; overflow: hidden; }
    .hero::before { content: ''; position: absolute; top: -40px; right: -40px; width: 200px; height: 200px; background: radial-gradient(circle, #ff3c00 0%, transparent 70%); opacity: 0.2; pointer-events: none; }
    .hero-title { font-family: 'Bebas Neue', sans-serif; font-size: 72px; letter-spacing: 3px; color: #ffffff; line-height: 1; margin-bottom: 6px; }
    .hero-title span { color: #ff3c00; }
    .hero-sub { font-size: 12px; color: #888; letter-spacing: 1.5px; text-transform: uppercase; }
    .form-box { background: var(--surface); border: 0.5px solid var(--border); border-radius: var(--radius); padding: 1.25rem; margin-bottom: 1.5rem; }
    .form-row { display: flex; gap: 10px; align-items: flex-end; flex-wrap: wrap; }
    .field { display: flex; flex-direction: column; gap: 6px; }
    .field label { font-size: 11px; color: var(--text-muted); letter-spacing: 0.5px; text-transform: uppercase; font-weight: 500; }
    .field input, .field textarea { border: 0.5px solid var(--border-hover); border-radius: var(--radius-sm); padding: 9px 12px; font-family: 'DM Sans', sans-serif; font-size: 14px; background: var(--bg); color: var(--text); outline: none; transition: border-color 0.15s; }
    .field input:focus, .field textarea:focus { border-color: #ff3c00; }
    .field textarea { resize: none; height: 62px; line-height: 1.5; }
    .field-name { width: 150px; }
    .field-frase { flex: 1; min-width: 200px; }
    .btn-post { background: #ff3c00; color: #fff; border: none; border-radius: var(--radius-sm); padding: 0 22px; height: 62px; font-family: 'DM Sans', sans-serif; font-size: 14px; font-weight: 500; cursor: pointer; white-space: nowrap; transition: opacity 0.15s, transform 0.1s; align-self: flex-end; }
    .btn-post:hover { opacity: 0.85; }
    .btn-post:active { transform: scale(0.97); }
    .btn-post:disabled { opacity: 0.5; cursor: not-allowed; }
    .err { font-size: 12px; color: #e24b4a; margin-top: 8px; display: none; }
    .feed-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.75rem; }
    .feed-label { font-size: 11px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; font-weight: 500; }
    .count-badge { background: #ff3c00; color: #fff; font-size: 11px; font-weight: 500; padding: 3px 10px; border-radius: 20px; }
    .feed { display: flex; flex-direction: column; gap: 10px; }
    .card { background: var(--surface); border: 0.5px solid var(--border); border-radius: var(--radius); padding: 1rem 1.25rem; display: flex; gap: 12px; align-items: flex-start; animation: fadeIn 0.3s ease; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    .avatar { width: 38px; height: 38px; border-radius: 50%; background: #111; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 500; color: #ff3c00; flex-shrink: 0; font-family: 'Bebas Neue', sans-serif; letter-spacing: 1px; border: 0.5px solid #333; }
    .card-body { flex: 1; min-width: 0; }
    .card-name { font-size: 13px; font-weight: 500; color: #ff3c00; margin-bottom: 4px; }
    .card-text { font-size: 15px; color: var(--text); line-height: 1.6; word-break: break-word; }
    .card-time { font-size: 11px; color: var(--text-muted); margin-top: 6px; }
    .empty { text-align: center; padding: 2.5rem; color: var(--text-muted); font-size: 14px; border: 0.5px dashed var(--border-hover); border-radius: var(--radius); }
    .loading { text-align: center; padding: 2rem; color: var(--text-muted); font-size: 14px; }
    @media (max-width: 480px) {
      .hero-title { font-size: 56px; }
      .field-name { width: 100%; }
      .field-frase { width: 100%; }
      .btn-post { width: 100%; height: 46px; }
    }
  </style>
</head>
<body>
<div class="container">
  <div class="hero">
    <div class="hero-title">6<span>D</span></div>
    <div class="hero-sub">Deixa a tua marca para sempre</div>
  </div>
  <div class="form-box">
    <div class="form-row">
      <div class="field field-name">
        <label>O teu nome</label>
        <input type="text" id="inp-nome" placeholder="ex: João" maxlength="30"/>
      </div>
      <div class="field field-frase">
        <label>A tua frase</label>
        <textarea id="inp-frase" placeholder="Escreve algo que fique para sempre..." maxlength="280"></textarea>
      </div>
      <button class="btn-post" id="btn-post" onclick="postar()">Publicar →</button>
    </div>
    <div class="err" id="err-msg">Preenche o nome e a frase antes de publicar.</div>
  </div>
  <div class="feed-header">
    <span class="feed-label">Frases da comunidade</span>
    <span class="count-badge" id="count">0</span>
  </div>
  <div id="feed">
    <div class="loading" id="loading-msg">A carregar frases...</div>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getFirestore, collection, addDoc, onSnapshot, orderBy, query, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyBBIEITzCY1suYIg9cgTjP8DBqQCCiQx40",
    authDomain: "d2026-b865c.firebaseapp.com",
    projectId: "d2026-b865c",
    storageBucket: "d2026-b865c.firebasestorage.app",
    messagingSenderId: "186359707165",
    appId: "1:186359707165:web:00a11460143796fd05b8f4"
  };

  const app = initializeApp(firebaseConfig);
  const db  = getFirestore(app);
  const col = collection(db, "frases");

  function esc(s) {
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  function timeAgo(ts) {
    if (!ts) return 'agora mesmo';
    const diff = Math.floor((Date.now() - ts.toMillis()) / 1000);
    if (diff < 60) return 'agora mesmo';
    if (diff < 3600) return Math.floor(diff / 60) + 'm atrás';
    if (diff < 86400) return Math.floor(diff / 3600) + 'h atrás';
    const d = ts.toDate();
    return d.getDate() + '/' + (d.getMonth()+1) + '/' + d.getFullYear();
  }

  function iniciais(nome) {
    return nome.trim().split(' ').map(p => p[0]).join('').toUpperCase().slice(0,2);
  }

  const q = query(col, orderBy("ts", "desc"));
  onSnapshot(q, (snap) => {
    document.getElementById('loading-msg')?.remove();
    const feed = document.getElementById('feed');
    document.getElementById('count').textContent = snap.size;
    if (snap.empty) {
      feed.innerHTML = '<div class="empty">Ainda não há frases. Sê o primeiro!</div>';
      return;
    }
    feed.innerHTML = snap.docs.map(doc => {
      const d = doc.data();
      return `<div class="card">
        <div class="avatar">${iniciais(d.nome)}</div>
        <div class="card-body">
          <div class="card-name">${esc(d.nome)}</div>
          <div class="card-text">${esc(d.frase)}</div>
          <div class="card-time">${timeAgo(d.ts)}</div>
        </div>
      </div>`;
    }).join('');
  });

  window.postar = async function() {
    const nome  = document.getElementById('inp-nome').value.trim();
    const frase = document.getElementById('inp-frase').value.trim();
    const err   = document.getElementById('err-msg');
    const btn   = document.getElementById('btn-post');
    if (!nome || !frase) { err.style.display = 'block'; return; }
    err.style.display = 'none';
    btn.disabled = true;
    btn.textContent = 'A publicar...';
    try {
      await addDoc(col, { nome, frase, ts: serverTimestamp() });
      document.getElementById('inp-nome').value  = '';
      document.getElementById('inp-frase').value = '';
    } catch(e) {
      err.textContent = 'Erro ao publicar. Tenta outra vez.';
      err.style.display = 'block';
    }
    btn.disabled = false;
    btn.textContent = 'Publicar →';
  };

  document.getElementById('inp-frase').addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); window.postar(); }
  });
  document.getElementById('inp-nome').addEventListener('keydown', e => {
    if (e.key === 'Enter') document.getElementById('inp-frase').focus();
  });
</script>
</body>
</html>
